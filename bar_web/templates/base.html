<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap (rápido y práctico) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            height: 100vh;
            background: #1e1e2f;
            color: white;
            position: fixed;
            width: 220px;
        }

        .sidebar a {
            color: #cfcfe8;
            display: block;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #343a40;
            color: white;
        }

        .content {
            margin-left: 220px;
            padding: 20px;
        }

        .navbar-custom {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
        }

        .card {
            border: none;
            border-radius: 10px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center py-3">Contracultura Bar</h4>
    <a href="/">Dashboard</a>
    <a href="/producto">Productos</a>
    <a href="/cliente">Clientes</a>
    <a href="/mesas">Mesas</a>
    <a href="/pedido">Pedidos</a>
</div>

<!-- Main Content -->
<div class="content">

    <!-- Navbar -->
    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{% block header %}Dashboard{% endblock %}</h5>
        <div>
            <span>Usuario</span>
        </div>
    </div>

    <!-- Page Content -->
    <div class="mt-4">
        {% block content %}
        
        {% endblock %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
